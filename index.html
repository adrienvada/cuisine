<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carnet de cuisine</title>
  <meta name="description" content="Le carnet de recettes d'Evadri — recettes, mode cuisine pas-à-pas et liste de courses.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#42603A">
  <!-- Aperçu quand on partage le carnet ; chaque recette a le sien dans r/ -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carnet de cuisine">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="🌿 Le carnet de cuisine d'Evadri">
  <meta property="og:description" content="Recettes illustrées, mode cuisine pas-à-pas et liste de courses automatique.">
  <meta property="og:image" content="https://adrienvada.fr/cuisine/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Icône PNG en plus du SVG : certains robots d'aperçu (WhatsApp, iMessage…)
       ignorent les favicons SVG et retombent sinon sur le favicon.ico du
       domaine racine — donc celui du site principal. -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cuisine">
  <link rel="preload" as="font" type="font/woff2" href="fonts/caveat.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="fonts/cormorant.woff2" crossorigin>
  <link rel="stylesheet" href="css/polices.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/accueil.css">
  <link rel="stylesheet" href="css/fiche.css">
  <link rel="stylesheet" href="css/cuisine.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/courses.css">
  <link rel="stylesheet" href="css/minuteurs.css">
  <link rel="stylesheet" href="css/savoirs.css">
  <!-- Les modules s'importent les uns les autres : sans ces préchargements, le
       navigateur ne découvre chaque import qu'après avoir lu le module qui le
       demande, et les requêtes s'enchaînent une à une. -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/core/courses.js">
  <link rel="modulepreload" href="js/core/etat.js">
  <link rel="modulepreload" href="js/core/fonds.js">
  <link rel="modulepreload" href="js/core/format.js">
  <link rel="modulepreload" href="js/core/html.js">
  <link rel="modulepreload" href="js/core/icones.js">
  <link rel="modulepreload" href="js/core/menu.js">
  <link rel="modulepreload" href="js/core/recettes.js">
  <link rel="modulepreload" href="js/core/seance.js">
  <link rel="modulepreload" href="js/ui/feuilles.js">
  <link rel="modulepreload" href="js/ui/minuteurs.js">
  <link rel="modulepreload" href="js/ui/partage.js">
  <link rel="modulepreload" href="js/ui/routeur.js">
  <link rel="modulepreload" href="js/ui/theme.js">
  <link rel="modulepreload" href="js/ui/toast.js">
  <link rel="modulepreload" href="js/ui/visuel.js">
  <link rel="modulepreload" href="js/vues/accueil.js">
  <link rel="modulepreload" href="js/vues/courses.js">
  <link rel="modulepreload" href="js/vues/cuisine.js">
  <link rel="modulepreload" href="js/vues/fiche.js">
  <link rel="modulepreload" href="js/vues/menu.js">
  <link rel="modulepreload" href="js/vues/savoirs.js">
  <link rel="modulepreload" href="js/sync.js">
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activer le mode sombre" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>

  <button id="sync-btn" class="theme-toggle sync-btn" type="button" aria-label="Se connecter au carnet partagé" data-etat="off" hidden>
    <!-- Nuage barré : pas connecté -->
    <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.2A6 6 0 0 1 17.9 9.7 4.5 4.5 0 0 1 20 17.3"/><path d="M6.5 18A4.5 4.5 0 0 1 5.4 9.3"/><path d="M3 3l18 18"/></svg>
    <!-- Flèches circulaires : connexion en cours -->
    <svg class="ic-attente" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/><path d="M21 21v-5h-5"/></svg>
    <!-- Nuage coché : connecté -->
    <svg class="ic-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 1 0 5.3 17.2 4.5 4.5 0 0 0 6.5 19z"/><path d="M9 13.5l2.2 2.2L15.5 11"/></svg>
    <!-- Wi-Fi barré : connecté mais hors réseau -->
    <svg class="ic-hors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.6a10 10 0 0 1 4-2.3"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M12 5a15 15 0 0 1 10 3.8"/><path d="M15 10.3a10 10 0 0 1 4 2.3"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/></svg>
  </button>

  <main id="app"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Recettes</span>
    </a>
    <a href="#/menu" data-tab="menu">
      <span class="cart-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3v7"/></svg>
        <span class="badge" id="menu-badge" hidden></span>
      </span>
      <span>Au menu</span>
    </a>
    <a href="#/courses" data-tab="courses">
      <span class="cart-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="badge" id="cart-badge" hidden></span>
      </span>
      <span>Courses</span>
    </a>
    <!-- Fiole : le savoir qui se transmet d'une recette à l'autre -->
    <a href="#/fondamentaux" data-tab="fond">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2h5"/><path d="M10.5 2v6.2L5.3 18.4A2 2 0 0 0 7.1 21h9.8a2 2 0 0 0 1.8-2.6L13.5 8.2V2"/><path d="M7.7 14h8.6"/></svg>
      <span>Savoirs</span>
    </a>
  </nav>

  <div id="timer-tray" class="timer-tray" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/recipes.js"></script>
  <script src="js/placard.js"></script>
  <script src="js/allergenes.js"></script>
  <script src="js/saisons.js"></script>
  <script src="js/substitutions.js"></script>
  <script src="js/fondamentaux.js"></script>
  <script src="js/illos.js"></script>
  <script src="js/sync-config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
