name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vérifier les données des recettes
        run: npm run verifier
      - name: Tests unitaires
        run: npm test
      - name: Tests de bout en bout
        run: npm run test:e2e
      - name: Pages de partage à jour
        run: |
          npm run pages
          git diff --exit-code -- r f
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
